[package]
name = "hypr-which-key"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.95"
async-std = "1.13.0"
clap = "4.5.23"
clap-verbosity-flag = "3.0.2"
env_logger = "0.11.6"
# async-channel = "2.3.1"
# gio = "0.20.0"
# glib = "0.20.0"
# gtk4 = "0.9.0"
hyprland = { git = "https://github.com/VTimofeenko/hyprland-rs", branch = "add-description-to-binds" }
iced = { version = "0.13.1", features = ["advanced", "image", "tokio"] }
log = "0.4.22"
serde = {version = "1.0.204", features = ["derive"]}
serde_json = "1.0.120"
subprocess = "0.2.9"
